<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { background-color: #282828; color: #E0E0E0; font-family: sans-serif; padding: 10px; font-size: 11px; }
        .title { font-weight: 600; margin-bottom: 8px; color: #8a8a8a; }
        button { width: 100%; padding: 6px; margin-bottom: 6px; background: #323232; color: #E0E0E0; border: 1px solid #444; border-radius: 4px; cursor: pointer; }

        .danger { border-color: #d73a49; color: #d73a49; }
        .danger:hover { background: #d73a49; color: white; }
    </style>
</head>
